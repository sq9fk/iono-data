# SQ9FK / SQ9UM on a Synology NAS (Container Manager → Project) or any Docker host:
#   iono-trigger  starts the iono-data relay on GitHub every 15 minutes (needs GITHUB_TOKEN in .env)
#   anteny-sync   keeps local copies of the antenna simulator pages from GitHub (public, no token)
#   anteny-web    serves them: http://<NAS>:8090/ (port WEB_PORT in .env)
# Copy this folder to the NAS, create .env from .env.example, then: docker compose up -d
services:
  iono-trigger:
    image: curlimages/curl:8.10.1
    container_name: iono-trigger
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/trigger.sh"]
    volumes:
      - ./trigger.sh:/trigger.sh:ro
    mem_limit: 32m
    logging: &logs
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"

  anteny-sync:
    image: alpine/git:2.45.2
    container_name: anteny-sync
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "/sync.sh"]
    volumes:
      - ./sync.sh:/sync.sh:ro
      - ./www:/www
    mem_limit: 128m
    logging: *logs

  anteny-web:
    image: nginx:1.27-alpine
    container_name: anteny-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8090}:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - anteny-sync
    mem_limit: 64m
    logging: *logs
