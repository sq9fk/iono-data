# Local copies of the antenna pages (see sync.sh): static files, git metadata hidden, the big pages compressed
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ~ /\.git { return 404; }

    location / {
        try_files $uri $uri/ =404;
        # the pages change with every deployment: always revalidate
        add_header Cache-Control "no-cache";
    }
}
